name: Build and deploy to Azure App Service

# Builds the frontend, assembles it next to the backend the way
# backend/src/server.js's static-file serving expects (frontend/dist/ as a
# sibling of backend/, matching the Startup Command `node backend/src/server.js`
# documented in AZURE_SETUP.md Part C, step 4), and zip-deploys that package
# on every push to main. See AZURE_SETUP.md's "8. Deploying: GitHub Actions"
# for the one-time setup this workflow needs (AZURE_WEBAPP_NAME below, and
# the AZURE_WEBAPP_PUBLISH_PROFILE repo secret).

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Replace with your App Service's actual name (Azure Portal → App
  # Service → Overview → Name) before the first real deploy.
  AZURE_WEBAPP_NAME: your-app-service-name
  NODE_VERSION: '22.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Assemble deployment package
        # backend/ and frontend/dist/ as siblings under one folder, matching
        # what AZURE_SETUP.md's Startup Command (node backend/src/server.js)
        # and server.js's static-file serving both expect.
        run: |
          mkdir -p deploy_package/backend
          mkdir -p deploy_package/frontend
          cp -r backend/. deploy_package/backend/
          cp -r frontend/dist deploy_package/frontend/dist
          rm -rf deploy_package/backend/.env

      - name: Zip deployment package
        working-directory: deploy_package
        run: zip -r ../release.zip . -x "*.git*"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
